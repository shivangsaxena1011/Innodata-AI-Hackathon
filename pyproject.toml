[project]
name = "codeforge-ai"
version = "0.1.0"
description = "CodeForge AI: a coding task factory that turns real repositories into validated Harbor feature-development tasks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shivang Saxena" },
    { name = "Rani Malviya" },
]
dependencies = [
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "litellm==1.110.1",
    "tree-sitter==0.26.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "typer==0.29.2",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.16",
    "ruff==0.17.6",
]

[project.scripts]
codeforge = "codeforge.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "docker: needs a running Docker engine",
    "llm: calls a real model provider",
    "harbor: needs the Harbor CLI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["research", "generated_tasks", "workspace", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Typer declares CLI options as call defaults by design.
extend-ignore = ["B008"]
